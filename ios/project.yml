name: UniversalCamPhone
options:
  bundleIdPrefix: com.universalcam
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    VALID_ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64

targets:
  UniversalCamPhone:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UniversalCamPhone
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universalcam.phone
        PRODUCT_NAME: UniversalCam
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"       # iPhone only
        VALID_ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""              # Set your Team ID here or via Xcode
        INFOPLIST_FILE: UniversalCamPhone/Info.plist
        CODE_SIGN_ENTITLEMENTS: UniversalCamPhone/UniversalCamPhone.entitlements
        ENABLE_BITCODE: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    info:
      path: UniversalCamPhone/Info.plist
      properties:
        CFBundleName: UniversalCam
        CFBundleDisplayName: UniversalCam
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - voip
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.universalcam.phone.stream-keepalive
        NSCameraUsageDescription: "UniversalCam uses your camera to stream video to your Windows PC."
        NSMicrophoneUsageDescription: "UniversalCam uses your microphone to stream audio to your Windows PC."
        NSLocalNetworkUsageDescription: "UniversalCam connects to your Windows PC on the local network to stream your camera."
        NSBonjourServices:
          - _universalcam._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: UniversalCamPhone/UniversalCamPhone.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.networking.multicast: true
    dependencies: []
    scheme:
      testTargets: []
      gatherCoverageData: false

schemes:
  UniversalCamPhone:
    build:
      targets:
        UniversalCamPhone: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
